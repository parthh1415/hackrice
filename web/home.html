<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minima</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2314171A'/%3E%3Crect x='4' y='4' width='8' height='8' rx='1' fill='%23E5484D'/%3E%3C/svg%3E">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shell.css">
</head>
<body class="entry">
<!-- Two mirrored fans of Béziers rather than the dot field. Same job — say
     this screen is not an instrument — with motion that reads as drift instead
     of as a signal. -->
<svg id="paths" class="entry-paths" viewBox="0 0 696 316" aria-hidden="true"></svg>

<!-- One name, one sentence, one way in. The two big figures that used to sit
     here were the direct loss and the loss after the cascade, and the second
     one is the limit the search was given — at a 10% limit it reads 10.00%
     every time, which looks like a finding and is an input. They belong on the
     screens that can show their working. -->
<main class="entry-stage entry-centred">
  <!-- Letter by letter, a beat apart. The name is the only thing on this page
       big enough to be worth arriving. -->
  <h1 class="entry-mark" id="mark">Minima</h1>

  <p class="entry-quote">Your portfolio is fine until someone else<br>is forced to sell.</p>

  <div class="entry-actions">
    <!-- The original's treatment: a gradient hairline around a pill, the label
         at rest and the arrow stepping right on hover. -->
    <span class="entry-cta"><a href="index.html">Import your portfolio<i>&rarr;</i></a></span>
    <span class="entry-cta entry-cta-quiet"><a href="index.html?demo">Use the demo book<i>&rarr;</i></a></span>
  </div>

  <p class="entry-note" id="eNote">&nbsp;</p>
</main>

<script src="shared.js"></script>
<script src="paths.js"></script>
<script>
const paths = document.getElementById("paths");
floatingPaths(paths, { position: 1, seed: 1 });
floatingPaths(paths, { position: -1, seed: 7 });

/* The one line of figures on this page comes off the engine, like every other
   number in the product. The entrance is the one screen where a hardcoded
   number would never be caught by anything, which is exactly why it must not
   be one. */
/* Split after load so the markup keeps one readable word — a heading built
   from nine spans in the source is a heading no screen reader and no view-source
   reader thanks you for. textContent is unchanged either way. */
(() => {
  const mark = document.getElementById("mark");
  const word = mark.textContent;
  mark.textContent = "";
  [...word].forEach((letter, i) => {
    const span = document.createElement("span");
    span.className = "entry-letter";
    span.textContent = letter;
    span.style.animationDelay = `${40 + i * 45}ms`;
    mark.appendChild(span);
  });
})();

(async () => {
  try {
    const f = await api("/api/portfolio/full?limit=0.10", {});
    if (!f || !f.found) return;
    document.getElementById("eNote").textContent =
      `Reverse stress testing on SEC 13F-HR filings · ` +
      `${(f.funds || []).length} books, ${(f.tickers || []).length} names · ` +
      `computed on this machine, nothing uploaded`;
  } catch { /* the entrance still works without its footnote */ }
})();
</script>
</body>
</html>
