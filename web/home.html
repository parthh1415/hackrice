<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firebreak</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2314171A'/%3E%3Crect x='4' y='4' width='8' height='8' rx='1' fill='%23E5484D'/%3E%3C/svg%3E">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shell.css">
</head>
<body class="entry">
<canvas id="glow" class="entry-glow" aria-hidden="true"></canvas>

<!-- One name, one sentence, one way in. The two big figures that used to sit
     here were the direct loss and the loss after the cascade, and the second
     one is the limit the search was given — at a 10% limit it reads 10.00%
     every time, which looks like a finding and is an input. They belong on the
     screens that can show their working. -->
<main class="entry-stage">
  <h1 class="entry-mark">Firebreak</h1>

  <p class="entry-quote">Your portfolio is fine until someone else<br>is forced to sell.</p>

  <div class="entry-actions">
    <a class="btn btn-primary btn-lg" href="index.html">Import your portfolio</a>
    <a class="btn btn-outline btn-lg" href="index.html?demo">Use the demo book</a>
  </div>

  <p class="entry-note" id="eNote">&nbsp;</p>
</main>

<script src="shared.js"></script>
<script src="glow.js"></script>
<script>
dottedGlow(document.getElementById("glow"));

/* The one line of figures on this page comes off the engine, like every other
   number in the product. The entrance is the one screen where a hardcoded
   number would never be caught by anything, which is exactly why it must not
   be one. */
(async () => {
  try {
    const f = await api("/api/portfolio/full?limit=0.10", {});
    if (!f || !f.found) return;
    document.getElementById("eNote").textContent =
      `Reverse stress testing on SEC 13F-HR filings · ` +
      `${(f.funds || []).length} books, ${(f.tickers || []).length} names · ` +
      `computed on this machine, nothing uploaded`;
  } catch { /* the entrance still works without its footnote */ }
})();
</script>
</body>
</html>
