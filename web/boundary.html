<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boundary · Firebreak</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shell.css">
</head>
<body class="shell">
<main class="col">
    <header>
      <h1 id="title">Where the system stops absorbing</h1>
      <p class="lede" id="lede">—</p>
      <p class="small muted" id="clampNote" hidden></p>
    </header>

    <!-- five tiles do not fit in a 522px column: they wrapped to two rows and
         left one tile alone on the second. The strip spans both cards. -->
    <div class="card" id="statCard" hidden><div class="stats" id="stats"></div></div>

    <div class="board" id="board" hidden>
      <div class="card">
        <div class="card-header">
          <!-- nowrap: the title wrapped at rest and un-wrapped on hover (the
     readout is shorter), so the map, legend and footer jumped 16px
     under the cursor and back again on leave. -->
          <span class="card-title nowrap" id="mapTitle">Amplification</span>
          <span class="sub num readout" id="readout"></span>
        </div>
        <div class="card-body tight">
          <!-- §5: the cells are painted into a 2D context; the axes, the
               contour, the marker and the hover box stay in SVG on top of it,
               where text is text and lines are lines. -->
          <div class="map-stack">
            <canvas class="map-cells" id="mapCells" width="1040" height="1000" aria-hidden="true"></canvas>
            <svg class="map" id="map" viewBox="0 0 520 500" tabindex="0" role="img"
                 aria-label="Heatmap of amplification by leverage and crowding. The table beside it lists the same values."></svg>
          </div>
        </div>
        <div class="card-footer small muted" id="legend"></div>
        <div class="card-footer small muted" id="mapDesc"></div>
      </div>

      <div class="card">
        <div class="card-header"><span class="card-title">Row by row</span>
          <span class="sub" id="rowSub"></span></div>
        <div class="card-body tight">
          <table>
            <thead><tr><th>Leverage</th><th class="r" id="atCol">At</th>
              <th class="r">Row min</th><th class="r">Row max</th><th class="r">Over 1.5×</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card" id="caveatCard" hidden>
      <div class="card-header"><span class="card-title">What this does not say</span>
        <span class="card-desc" id="caveatDesc"></span></div>
      <div class="card-body tight"><table><tbody id="caveats"></tbody></table></div>
    </div>
</main>
<script src="shared.js"></script>
<script src="shell.js"></script>
<script>
paintShell("boundary");
(async () => { if (await seedDemoIfAsked()) location.replace(location.pathname); })();

/* The sequential ramp from tokens.css, §2 — paper at no amplification,
   through to the darkest stop where the system is worst. Read off the custom
   properties rather than copied here, so §7's rule holds: there is no raw hex
   outside tokens.css, including inside a canvas call.

   Six bands for six stops, and 1.5 is deliberately one of the edges — it is
   the threshold the contour is drawn at and the one the tiles count against,
   so a colour change happens exactly where the line does. */
const RAMP = (() => {
  const css = getComputedStyle(document.documentElement);
  return [0, 1, 2, 3, 4, 5].map((i) => css.getPropertyValue(`--ramp-${i}`).trim());
})();
const BANDS = [
  [1.0005, 0, "1.00"],
  [1.25,   1, "1.00–1.24"],
  [1.5,    2, "1.25–1.49"],
  [2.0,    3, "1.50–1.99"],
  [2.5,    4, "2.00–2.49"],
  /* Unbounded, and written as such. 1e9 was a stand-in for "no upper edge" and
     it is not one: a lookup of the band's own edge falls off the end of the
     list, because 1e9 < 1e9 is false. */
  [Infinity, 5, "≥ 2.50"],
];
/* Which band a value falls in. Split out from the colour lookup on purpose:
   this is the half that can be wrong, and it is pure — no CSS, no DOM — so the
   harness can run it over every value in a real grid. RAMP[k] after it is an
   array index. */
const bandOf = (a) => BANDS.findIndex(([hi]) => a < hi);

/* The single mapping from a value to a colour. The painter uses it and the
   legend uses it, so a cell and its key cannot disagree. */
const fillFor = (a) => RAMP[BANDS[bandOf(a)][1]];

(async () => {
  const P = (FB.state.result && FB.state.result.params) || {};
  const q = `leverage=${P.leverage ?? 5}&gamma=${P.gamma ?? 0.2}&band=${P.band ?? 1.05}`;
  let b;
  try { b = await api(`/api/boundary?${q}`); }
  catch (e) {
    document.getElementById("title").textContent = "The engine did not answer";
    document.getElementById("lede").textContent = e.message;
    return;
  }

  const grid = b.grid, levs = b.leverage_axis, ovs = b.overlap_axis, here = b.here;
  const asset = b.reference_asset, nFunds = (b.funds || []).length;
  const shockPct = Math.abs(b.reference_shock) * 100;

  const clamp = (b.params.clamped || [])[0];
  if (clamp) {
    const n = document.getElementById("clampNote");
    n.hidden = false;
    n.textContent = `You asked for ${clamp.name} ${clamp.given}; this build accepts ` +
      `${clamp.reason.replace("outside ", "")}, so it used ${clamp.used}.`;
  }

  /* The column nearest the real book's crowding. Every reading on this page is
     taken down that column, because it is the only one that is about the books
     as they are actually filed. */
  const jN = ovs.reduce((best, o, j) => Math.abs(o - here.overlap) < Math.abs(ovs[best] - here.overlap) ? j : best, 0);
  const iN = levs.reduce((best, l, i) => Math.abs(l - here.leverage) < Math.abs(levs[best] - here.leverage) ? i : best, 0);
  const col = grid.map((r) => r[jN]);
  const iC = col.findIndex((a) => a >= 1.5);

  document.getElementById("lede").textContent = iC < 0
    ? `As filed, the ${nFunds} books overlap ${here.overlap.toFixed(2)} and absorb a ` +
      `${shockPct.toFixed(2)}% ${asset} shock at every leverage tested, to ${levs[levs.length - 1].toFixed(1)}×. ` +
      `Every cell is a full cascade at that fixed shock.`
    : `As filed, the ${nFunds} books overlap ${here.overlap.toFixed(2)} and absorb a ` +
      `${shockPct.toFixed(2)}% ${asset} shock up to ${levs[Math.max(0, iC - 1)].toFixed(2)}× leverage ` +
      `and amplify it ${col[iC].toFixed(2)}× at ${levs[iC].toFixed(2)}×. Every cell is a full cascade ` +
      `at that fixed shock; the line is where amplification crosses 1.5×.`;

  document.getElementById("mapTitle").textContent = `${asset} −${shockPct.toFixed(2)}%, everywhere`;
  document.getElementById("mapDesc").textContent =
    `${grid.length * ovs.length} full cascades · γ ${b.params.gamma} · band ${b.params.band}× · nothing is interpolated`;

  /* ── the map ─────────────────────────────────────────────────────────── */
  const ns = "http://www.w3.org/2000/svg";
  const mk = (t, a) => { const e = document.createElementNS(ns, t);
    for (const k in a) e.setAttribute(k, a[k]); return e; };
  const svg = document.getElementById("map");
  const X0 = 56, Y1 = 458, PITCH = 28;
  const cx = (j) => X0 + PITCH * j;
  /* rows are drawn bottom-up so leverage rises up the page and the failing
     region is the top of the map, which is the direction people already read
     "worse" in. */
  const cy = (i) => Y1 - PITCH * (i + 1);

  /* §5: rects in a 2D context. The backing store is twice the drawing size so
     the cell edges stay sharp; everything below is written in the SVG's own
     520x500 coordinates, which is also what the hit test reads. */
  const cvs = document.getElementById("mapCells");
  const ctx = cvs.getContext && cvs.getContext("2d");
  if (ctx) {
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    ctx.clearRect(0, 0, 520, 500);
    grid.forEach((row, i) => row.forEach((a, j) => {
      ctx.fillStyle = fillFor(a);
      ctx.fillRect(cx(j) + 0.5, cy(i) + 0.5, PITCH - 1, PITCH - 1);
    }));
  } else {
    /* jsdom, and any browser with canvas switched off. The table beside the
       map carries every one of these numbers, so say that rather than leave a
       blank rectangle under a heading promising a map. */
    const note = document.getElementById("mapDesc");
    if (note) note.textContent =
      "This browser did not provide a drawing context, so the map is not painted. " +
      "Every value it would show is in the table beside it.";
  }

  /* The 1.5x line, drawn on cell EDGES. Marching squares would interpolate a
     curve between cells the model never computed, on a page whose own header
     says nothing is interpolated. */
  const over = (i, j) => grid[i][j] >= 1.5;
  for (let i = 0; i < grid.length; i++)
    for (let j = 0; j < ovs.length - 1; j++)
      if (over(i, j) !== over(i, j + 1))
        svg.appendChild(mk("line", { x1: cx(j + 1), x2: cx(j + 1), y1: cy(i), y2: cy(i) + PITCH,
          class: "bd-contour", "stroke-linecap": "square", "pointer-events": "none" }));
  for (let i = 0; i < grid.length - 1; i++)
    for (let j = 0; j < ovs.length; j++)
      if (over(i, j) !== over(i + 1, j))
        svg.appendChild(mk("line", { y1: cy(i), y2: cy(i), x1: cx(j), x2: cx(j) + PITCH,
          class: "bd-contour", "stroke-linecap": "square", "pointer-events": "none" }));

  levs.forEach((l, i) => {
    const t = mk("text", { x: X0 - 5, y: cy(i) + 17.5, "text-anchor": "end",
      class: "bd-tick" });
    t.textContent = l.toFixed(1); svg.appendChild(t);
  });
  const yt = mk("text", { x: 14, y: 234, "text-anchor": "middle", transform: "rotate(-90 14 234)",
    class: "bd-axis" });
  yt.textContent = "Gross leverage λ"; svg.appendChild(yt);

  ovs.forEach((o, j) => {
    svg.appendChild(mk("line", { x1: cx(j) + 14, x2: cx(j) + 14, y1: Y1, y2: Y1 + 4, class: "bd-rule" }));
    /* every column would collide at this pitch — 0.99 beside 1.00 */
    if (![0, 2, 4, 6, 8, 10, 12, ovs.length - 1].includes(j)) return;
    const t = mk("text", { x: cx(j) + 14, y: 474, "text-anchor": "middle",
      class: "bd-tick" });
    t.textContent = o.toFixed(2); svg.appendChild(t);
  });
  const xt = mk("text", { x: 280, y: 492, "text-anchor": "middle",
    class: "bd-axis" });
  xt.textContent = "Mean pairwise overlap (cosine)"; svg.appendChild(xt);

  /* "You are here", placed by VALUE. The real book is not a grid point —
     5.0x sits between two rows and 0.7117 between two columns — so snapping it
     to the nearest cell would put the marker somewhere the book is not. */
  const between = (axis, v, at) => {
    let k = 0;
    while (k < axis.length - 2 && axis[k + 1] < v) k++;
    const span = axis[k + 1] - axis[k];
    const t = span ? Math.max(0, Math.min(1, (v - axis[k]) / span)) : 0;
    return at(k, t);
  };
  const xm = between(ovs, here.overlap, (k, t) => cx(k) + 14 + PITCH * t);
  const ym = between(levs, here.leverage, (k, t) => cy(k) + 14 - PITCH * t);
  [[X0, ym, xm - 9, ym], [xm + 9, ym, X0 + PITCH * ovs.length, ym],
   [xm, 10, xm, ym - 9], [xm, ym + 9, xm, Y1]].forEach(([x1, y1, x2, y2]) =>
    svg.appendChild(mk("line", { x1, y1, x2, y2, class: "bd-crosshair" })));
  /* §5: a small ink cross. It was a cyan ring, and there is no cyan any more —
     nor any second colour for it to be. */
  svg.appendChild(mk("line", { x1: xm - 6, y1: ym, x2: xm + 6, y2: ym, class: "bd-here" }));
  svg.appendChild(mk("line", { x1: xm, y1: ym - 6, x2: xm, y2: ym + 6, class: "bd-here" }));
  /* The label sits over its own dashed crosshair and over the brightest cells
     on the map, so it needs a ground of its own. getBBox() is the obvious way
     to size that ground and it returns zeros here — the text has not been laid
     out at the moment it is appended — so the plate is measured from the
     string instead: 10px of this mono face is 6px per character, which is
     exact for a monospace and needs no layout to be true. */
  /* §6: no ALL-CAPS labels. */
  const text = `As filed — λ ${here.leverage.toFixed(1)}, overlap ${here.overlap.toFixed(2)}`;
  const w = text.length * 6, right = xm > 300;
  const lx = right ? xm - 12 - w : xm + 12;
  svg.appendChild(mk("rect", { x: lx - 4, y: ym - 19, width: w + 8, height: 15,
    class: "bd-plate" }));
  const lbl = mk("text", { x: lx, y: ym - 8, class: "bd-here-label" });
  lbl.textContent = text;
  svg.appendChild(lbl);

  /* ── hover and keyboard ──────────────────────────────────────────────── */
  /* cyan, not white: white at 1px was indistinguishable from the 1.5x
     contour line, so hovering a cell ON the boundary showed nothing.
     Cyan is "current" everywhere else, which is what a hover is. */
  const hl = mk("rect", { class: "bd-hover", width: PITCH - 1, height: PITCH - 1,
    x: -99, y: -99 });
  svg.appendChild(hl);
  const readout = document.getElementById("readout");
  /* §5 wants the exact knob values and the value under the cursor, in mono, in
     a readout that does not move. It lives in the card header, which is why
     both it and the title are nowrap: the header used to re-wrap as the string
     changed length and the whole map jumped 16px under the cursor. */
  const say = (i, j, tail) => {
    readout.textContent = `λ ${levs[i].toFixed(2)}×   overlap ${ovs[j].toFixed(2)}   ` +
      `amplification ${grid[i][j].toFixed(2)}×${tail || ""}`;
    hl.setAttribute("x", cx(j) + 0.5); hl.setAttribute("y", cy(i) + 0.5);
  };
  let ci = iN, cj = jN;
  const home = () => say(iN, jN, "   (as filed)");
  home();
  /* The cells are painted, so there is nothing to be the event target any
     more. cellAt maps a pointer position to a grid index using the same X0,
     Y1 and PITCH the painter used — one geometry, read forwards to draw and
     backwards to hit-test, so the two cannot drift apart. */
  const cellAt = (clientX, clientY) => {
    const box = svg.getBoundingClientRect();
    if (!box.width || !box.height) return null;
    const x = (clientX - box.left) * (520 / box.width);
    const y = (clientY - box.top) * (500 / box.height);
    const j = Math.floor((x - X0) / PITCH);
    const i = Math.floor((Y1 - y) / PITCH);
    if (i < 0 || i >= levs.length || j < 0 || j >= ovs.length) return null;
    return [i, j];
  };
  svg.addEventListener("mousemove", (ev) => {
    const at = cellAt(ev.clientX, ev.clientY);
    if (!at) return;
    ci = at[0]; cj = at[1]; say(ci, cj);
  });
  svg.addEventListener("mouseleave", () => { ci = iN; cj = jN; home(); });
  bindKeys("boundary", {
    ArrowUp: () => { ci = Math.min(levs.length - 1, ci + 1); say(ci, cj); },
    ArrowDown: () => { ci = Math.max(0, ci - 1); say(ci, cj); },
    ArrowLeft: () => { cj = Math.max(0, cj - 1); say(ci, cj); },
    ArrowRight: () => { cj = Math.min(ovs.length - 1, cj + 1); say(ci, cj); },
  });

  /* ── the tiles ───────────────────────────────────────────────────────── */
  const flat = grid.flat();
  const worst = Math.max(...flat);
  let wi = 0, wj = 0;
  grid.forEach((r, i) => r.forEach((a, j) => { if (a === worst) { wi = i; wj = j; } }));
  const step = levs[1] - levs[0];
  const headroom = iC < 0 ? null : levs[iC] - here.leverage;

  document.getElementById("stats").innerHTML = [
    ["Amplification here", `${grid[iN][jN].toFixed(2)}×`,
      `λ ${levs[iN].toFixed(2)}× · overlap ${ovs[jN].toFixed(2)}`,
      grid[iN][jN] >= 1.5 ? "bad" : ""],
    ["Critical leverage",
      iC < 0 ? `none to ${levs[levs.length - 1].toFixed(1)}×` : `${levs[iC].toFixed(2)}×`,
      iC < 0 ? "the shock is absorbed at every row tested"
             : `${levs[Math.max(0, iC - 1)].toFixed(2)}× gives ${col[Math.max(0, iC - 1)].toFixed(2)}×, ${levs[iC].toFixed(2)}× gives ${col[iC].toFixed(2)}×`, ""],
    ["Leverage headroom",
      headroom === null ? "—" : `${headroom >= 0 ? "+" : "−"}${Math.abs(headroom).toFixed(2)}×`,
      `resolved to one grid step, ${step.toFixed(2)}×`,
      headroom !== null && headroom <= 0 ? "bad" : ""],
    ["Cells over 1.5×", `${flat.filter((a) => a >= 1.5).length} / ${flat.length}`,
      "pairs that amplify the shock", ""],
    ["Worst cell", `${worst.toFixed(2)}×`,
      `λ ${levs[wi].toFixed(1)}× · overlap ${ovs[wj].toFixed(2)}`, ""],
  ].map(([k, v, s, cls]) =>
    `<div class="stat"><div class="k">${k}</div><div class="v ${cls}">${v}</div><div class="s">${s}</div></div>`
  ).join("");

  /* The key reads its colours through fillFor, the same function that painted
     the cells. A legend with its own copy of the ramp is a legend that can be
     wrong about the map beside it. */
  document.getElementById("legend").innerHTML =
    /* Each swatch asks fillFor for the colour of a value INSIDE its own band,
       which is its lower edge — the previous band's upper one. Asking with the
       band's own upper edge is the one value guaranteed to land in the next
       band along, and on the last band it lands nowhere at all. */
    BANDS.map(([, , label], k) =>
      `<span><i class="swatch" style="background:${fillFor(k === 0 ? 1.0 : BANDS[k - 1][0])}"></i>${label}</span>`).join("") +
    `<span><i class="swatch swatch-line"></i>1.5× line</span>` +
    `<span><i class="swatch swatch-here"><svg viewBox="0 0 12 12" aria-hidden="true">` +
    `<path d="M1 6h10M6 1v10" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></i>as filed</span>`;

  /* ── the table, which is the key ─────────────────────────────────────── */
  document.getElementById("atCol").textContent = `At ${ovs[jN].toFixed(2)}`;
  document.getElementById("rowSub").textContent =
    `${ovs[jN].toFixed(2)} is the computed column nearest the filed books`;
  document.getElementById("rows").innerHTML = levs.map((l, i) => i).reverse().map((i) => {
    const r = grid[i];
    return `<tr${i === iN ? ' style="background:var(--accent-bg)"' : ""}>
      <td${i === iN ? ' class="acc"' : ""}><b>${levs[i].toFixed(2)}×</b></td>
      <td class="r num"><i class="cellsw" style="background:${fillFor(r[jN])}"></i>${r[jN].toFixed(2)}×</td>
      <td class="r num muted">${Math.min(...r).toFixed(2)}×</td>
      <td class="r num muted">${Math.max(...r).toFixed(2)}×</td>
      <td class="r num muted">${r.filter((a) => a >= 1.5).length} / ${r.length}</td></tr>`;
  }).join("");

  /* ── what it does not say ────────────────────────────────────────────── */
  document.getElementById("caveatDesc").textContent =
    `${asset} −${shockPct.toFixed(2)}% · λ ${levs[0].toFixed(1)}–${levs[levs.length - 1].toFixed(1)}× · ` +
    `γ ${b.params.gamma} · band ${b.params.band}×`;
  document.getElementById("caveats").innerHTML = [
    ["Not a measurement",
     `Every cell is this model's own cascade under one declared leverage, one price-impact rule and ` +
     `one breach band. Nothing here was observed. Change the band and the line moves — where the ` +
     `boundary sits is a consequence of the band we chose, not a property of the market.`],
    ["One shock, one name",
     `The reference shock is ${asset} −${shockPct.toFixed(2)}%, held fixed in every cell. It is not ` +
     `your break point from Analysis and it is not a market-wide fall. A market-wide shock flattens ` +
     `this map — true and useless — which is why it was not used.`],
    ["Not monotone in crowding",
     `Sharpening the books concentrates them into the shocked name, so amplification can fall as ` +
     `crowding rises, and cells below the line that sit above it are real, not artefacts. Read the ` +
     `transition in leverage, where it is sharp` +
     (iC > 0 ? `: ${col[iC - 1].toFixed(2)}× at ${levs[iC - 1].toFixed(2)}× and ${col[iC].toFixed(2)}× at ${levs[iC].toFixed(2)}× at the filed overlap.` : ".")],
    ["The columns are not evenly spaced",
     `The horizontal axis blends the ${nFunds} real books toward each other or apart in ` +
     `${ovs.length} equal steps of that blend, not of overlap. The labels say where each column ` +
     `actually sits.`],
    ["Resolution is one cell",
     `The leverage axis steps by ${step.toFixed(2)}× and nothing between two rows was computed. ` +
     `"Critical leverage ${iC < 0 ? "none" : levs[Math.max(0, iC)].toFixed(2) + "×"}" means the first ` +
     `computed row over 1.5×, not a threshold to two decimals — and the declared ${here.leverage.toFixed(1)}× ` +
     `is not a row, so the marker sits between two.`],
  ].map(([k, v]) => `<tr><td style="width:180px"><b>${k}</b></td><td class="t small">${v}</td></tr>`).join("");

  document.getElementById("board").hidden = false;
  document.getElementById("statCard").hidden = false;
  document.getElementById("caveatCard").hidden = false;
})();
</script>
</body>
</html>
