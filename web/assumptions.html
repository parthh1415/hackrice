<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model · Firebreak</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shell.css">
</head>
<body class="shell">
<main class="col">
    <header>
      <h1>What is measured, and what we declared</h1>
      <p class="lede">Firebreak is a stress-testing model, not a forecast. Every input below is
        labelled by where it came from.</p>
    </header>
    <!-- First on the page, not last. This is the only screen that says what
         actually computed anything, and it used to sit under an eight-row
         table where you had to scroll to find it. §8: every page has exactly
         one hero figure, and this page had none — it is the number of full
         cascades the solver simulated to find the patch. -->
    <div class="card" id="engineCard" hidden>
      <div class="card-header"><span class="card-title">What computed the institutional patch</span>
        <span class="sub" id="engineNote"></span></div>
      <div class="card-body plot">
        <div class="figure">
          <span class="big num" id="engineEvals">—</span>
          <span class="small muted" id="engineLede">—</span>
        </div>
        <!-- The search itself, drawn by MATLAB. Hidden unless MATLAB is what
             ran: the file is a committed artefact of one solve, so showing it
             beside a Python result would illustrate a search that did not
             happen for the scenario on screen. -->
        <figure class="trace" id="traceFig" hidden>
          <img id="traceImg" alt="Two stacked plots against cumulative function
            evaluations. Above, the best cost found so far, falling as a staircase
            and then flattening. Below, the mesh size, halving repeatedly and
            resetting at each restart.">
          <figcaption class="small muted">Each step down is a poll that found
            something cheaper; each flat run is the objective being unchanged
            across a range of cuts, which is what piecewise constant looks like.
            The mesh below halves every time a poll fails, and resets where a
            new start begins. This is why the solve is a direct search and not a
            gradient method — there is no gradient to follow.</figcaption>
        </figure>
      </div>
      <div class="card-body tight"><table><tbody id="engineRows"></tbody></table></div>
    </div>

    <div class="card">
      <div class="card-body tight"><table>
        <!-- every other table on the site has a header row; this one did not,
             so the provenance tag and the name in the left cell read as two
             unlabelled things rather than as a column. -->
        <thead><tr><th style="width:210px">Input</th><th class="t">What it is</th></tr></thead>
        <tbody id="rows"></tbody></table></div>
    </div>

</main>
<script src="shared.js"></script>
<script src="shell.js"></script>
<script>
paintShell("assumptions");
/* ?demo works on the other five pages; this was the only one that answered a
   demo link with an empty status bar. */
(async () => { if (await seedDemoIfAsked()) location.replace(location.pathname); })();
bindKeys("assumptions");
(async () => {
  let d = {};
  try { d = await api("/api/dataset"); } catch {}
  /* The knobs this session actually ran with; failing that, the engine's own
     declared defaults off /api/dataset — never a literal typed here, which is
     how the value on a methodology page drifts from the value in the model. */
  const P = (FB.state.result && FB.state.result.params) || d.defaults || {};
  const rows = [
    ["measured", "Holdings", `Real, and the only thing here that is. SEC 13F-HR filings, period
      ${d.quarter || "2026-06-30"}, ${(d.funds || []).length || 5} managers across
      ${(d.tickers || []).length || 10} names, $40.9B gross notional. Reproducible from EDGAR.`],
    /* The values themselves were never on this page — it described each
       assumption at length and never said what number was used, which is the
       one thing a page about declared inputs owes you. They come from the
       run's own params, so they follow the scenario rather than being typed
       here and going stale. */
    ["declared", `Gross leverage · ${P.leverage != null ? P.leverage.toFixed(1) + "×" : "—"}`,
      "No fund discloses it. One assumed value, applied to all five books."],
    ["declared", `Breach band · ${P.band != null ? P.band.toFixed(2) + "× target" : "—"}`,
      `How far past target a book runs before it is forced to sell${P.leverage != null && P.band != null
        ? `, so a book sells above ${(P.leverage * P.band).toFixed(2)}×` : ""}. ` +
      "This swings the headline harder than leverage or price impact."],
    ["declared", `Price impact · γ = ${P.gamma != null ? P.gamma : "—"}`,
      "A model, not a measurement. Δp/p = −γ · (dollars sold) / ADV, linear in participation. At γ=0 there is no contagion and amplification is exactly 1.00 — that is the control."],
    ["declared", "ADV", "Order-of-magnitude daily dollar volume. GOOGL's column sums Class A, Class C and two depositary-share lines, and its figure is Alphabet's combined volume across them."],
    /* "LIMIT" is the user's loss limit everywhere else in this product — in
       the nav, in the stat tiles, in "within the limit". Reusing it here for
       "things the model cannot see" put two unrelated meanings on one word. */
    ["not modelled", "What 13F omits", "Long-only US equity, quarterly, filed 45 days late. Options and bond-principal rows are filtered out. Shorts, derivatives and non-US holdings are invisible to us."],
    ["not modelled", "Your portfolio is an observer", "It takes the price damage; it does not join the network. A retail account does not move markets, so your fix changes how much of the cascade reaches you — not whether the cascade happens."],
    ["not modelled", "Not a prediction", "A break point is the smallest shock our model says crosses your limit under these assumptions. It is not a proven threshold and not a forecast."],
  ];
  /* This taxonomy was carried by colour — green for measured, amber for
     declared, grey for not modelled — set in tracked-out uppercase. §1 has no
     green and no amber, and §6 has no ALL-CAPS labels and no tracked-out
     eyebrow text, so all three of its devices go at once.

     It still has to encode three things, and in a monochrome page that means
     weight rather than hue: measured is full ink, declared is mid, not
     modelled is faint. The order is the confidence order, so the column reads
     from "we counted this" down to "we cannot see this" by how dark it is. */
  const rank = { measured: "prov-measured", declared: "prov-declared",
                 "not modelled": "prov-absent" };
  document.getElementById("rows").innerHTML = rows.map(([kind, name, body]) => `
    <tr><td class="prov-cell">
          <span class="prov ${rank[kind]}">${kind}</span>
          <b>${name}</b></td>
      <td class="small muted t">${body}</td></tr>`).join("");

  /* Which solver actually ran, and what it cost. The stabilisation step is
     the piece that goes to MATLAB; when MATLAB is not on the machine the API
     falls back to an exhaustive Python scan. Showing the fallback by name is
     the point — the alternative is a pitch that implies a solver nobody ran.

     The redesign dropped this strip along with the rest of the institutional
     screen, which left docs/devpost.md claiming it was on screen when it was
     not. It lives here now: this is the page about the model. */
  /* Driven by the knobs THIS session ran with, not by four literals. Hardcoded
     — and with `breaches` omitted entirely, so it defaulted to 2 — the card
     answered a question nobody had asked: Renaissance selling $441,665 over
     301 evaluations, where the pitch and the video script quote Citadel's
     $1,731,560 over 124, which is the >=3-breach answer. Two different
     scenarios, no label on either, four clicks apart. */
  const K = {
    leverage: P.leverage != null ? P.leverage : 5.0,
    gamma: P.gamma != null ? P.gamma : 0.2,
    band: P.band != null ? P.band : 1.05,
    breaches: P.breaches != null ? P.breaches : 2,
  };
  let st;
  try {
    st = await api(`/api/stabilise?leverage=${K.leverage}&gamma=${K.gamma}` +
                   `&band=${K.band}&breaches=${K.breaches}&asset=0`);
  } catch { return; }
  const e = st && st.engine;
  if (!e) return;

  /* MATLAB reports a float and Python an int, so this printed
     "936.2738333333334 ms" on one path and "12 ms" on the other. Nobody needs
     femtoseconds of a wall clock. */
  const ms = e.solve_ms == null ? "not recorded"
    : `${e.solve_ms < 1 ? e.solve_ms.toFixed(2) : Math.round(e.solve_ms)} ms`;
  const b = st.bought || {};
  /* This card describes the INSTITUTIONAL patch — the fund-book cut solved by
     MATLAB or the Python fallback. It is not the "Sell $478 of NVDA" on
     Defend, which comes from cheapest_portfolio_fix and is a different
     calculation on a different book. Saying "the fix" made the card read as a
     contradiction: a break point of 4.60% sitting two clicks after Analysis
     said 24.69%. */
  const erows = [
    /* the scenario, stated, because the same solver gives a different fund and
       a 4x different figure at a different breach count. */
    ["Applies to", `the five institutional books, at ${K.breaches}+ breaching`,
      "not your portfolio — your own fix is on Defend, solved by an exhaustive Python scan"],
    ["Patch found", `${st.fix.fund} sells ${usdExact(st.fix.sell_usd)} of ${st.fix.asset}`,
      `${(st.fix.reduction * 100).toFixed(4)}% of that position, ` +
      `${(st.fix.cost * 100).toFixed(4)}% of the system's gross assets`],
    ["Engine", e.name, e.note || ""],
    ["Solver", e.solver, e.kind === "matlab"
      ? "pattern search over (fund, asset, reduction) — no gradient, piecewise-constant feasible set"
      : "exhaustive scan over the same three-way grid"],
    ["Evaluations", String(e.evaluations), "cascades simulated to find the cheapest patch"],
    /* "Exit flag: 1" is MATLAB's vocabulary, not the reader's. The flag is
       still shown, because a judge who knows patternsearch will look for it —
       but the word in front of it says what it means. */
    ["Status", e.exit_flag === 1 ? "converged" : "did not converge cleanly",
      `solver exit flag ${e.exit_flag}`],
    ["Solve time", ms, e.solve_ms == null
      ? "the recorded run did not carry a timing, and we would rather say so than invent one"
      : "wall clock for the solve alone"],
  ];
  if (b.before_pct != null) {
    /* after_pct is null when the patched books have no break point left in the
       tested range — the fix working perfectly. Guarding only before_pct, as
       this did, is the same shape as the bug that blanked verify.html: the
       throw lands inside the template literal and takes the whole row with it. */
    const after = b.after_pct == null
      ? "none in range" : `−${b.after_pct.toFixed(2)}%`;
    erows.push(["What it bought the funds",
      b.measurable || b.after_pct == null
        ? `fund-book break point −${b.before_pct.toFixed(2)}% to ${after}`
        : `fund-book break point −${b.before_pct.toFixed(2)}% to ${after}, no measurable change`,
      /* resolution_pct is deliberately TWICE the search tolerance: the delta is
         the difference of two independently bisected searches, so each one's
         error lands in it. Quoting the single-search figure alone here would
         understate the bar this delta actually has to clear. */
      /* the API's note is a sentence fragment with no terminator; joining it
         to the next sentence bare reads as one run-on. */
      `${(b.note || "").replace(/[^.]$/, "$&.")} Each search resolves to ±${num(b.resolution_pct / 2, 3)}pp, ` +
      `so a difference of two has to clear ${num(b.resolution_pct, 3)}pp to mean anything.`]);
  }
  /* The payload already carries this, built by engine_label() from the result
     that actually came back. This line used to compose its own version and got
     it wrong twice over: it tested `kind === "matlab"`, which is only the LIVE
     engine, so an offline MATLAB result — the documented path, and the only
     one that works without the Engine API — fell through to "Python fallback ·
     MATLAB not found" while the body of the same card read "MATLAB ·
     patternsearch". And it hardcoded the solver name, so had fmincon run, the
     header would have said patternsearch anyway. One source, and it is the one
     that cannot inflate what ran. */
  document.getElementById("engineNote").textContent = e.name;

  /* The hero. A solver name is not a figure, so the figure is the work it did:
     every one of these is a full cascade simulated to price one candidate
     patch. It reads honestly on either engine — MATLAB's patternsearch runs
     658 of them, the Python fallback 301 — so the page never has to pretend
     MATLAB was here when it was not. */
  /* Only when MATLAB is what ran. The PNG ships with the repo, so the check is
     what stops a committed picture of a patternsearch run sitting under a
     Python result and implying it. */
  if (String(e.kind || "").startsWith("matlab")) {
    const fig = document.getElementById("traceFig");
    const img = document.getElementById("traceImg");
    /* Only reveal it once the file has actually loaded — a broken image icon
       under a heading about provenance is worse than no image. */
    img.addEventListener("load", () => { fig.hidden = false; });
    img.addEventListener("error", () => { fig.remove(); });
    img.src = "solve-trace.png";
  }

  document.getElementById("engineEvals").textContent =
    e.evaluations == null ? "—" : Number(e.evaluations).toLocaleString("en-US");
  document.getElementById("engineLede").textContent =
    e.evaluations == null
      ? `${e.name} — evaluation count not recorded.`
      : `full cascades simulated by ${e.name} to find the cheapest single cut that ` +
        `holds the five institutional books under ${K.breaches}+ breaching. ` +
        `${e.note.charAt(0).toUpperCase()}${e.note.slice(1)}.`;
  document.getElementById("engineRows").innerHTML = erows.map(([k, v, note]) => `
    <tr><td style="width:150px"><b>${k}</b></td>
        <td class="num t" style="width:320px">${v}</td>
        <td class="small muted t">${note}</td></tr>`).join("");
  document.getElementById("engineCard").hidden = false;
})();
</script>
</body>
</html>
