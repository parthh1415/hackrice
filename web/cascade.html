<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cascade · Minima</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shell.css">
</head>
<body class="shell">
<main class="col">
    <header>
      <h1>Why the loss grows</h1>
      <p class="lede" id="lede">—</p>
    </header>

    <div class="card">
      <div class="card-header">
        <span class="card-title" id="roundTitle">Round 0</span>
        <span class="transport">
          <button class="btn btn-outline btn-sm" id="prevBtn">Prev</button>
          <button class="btn btn-primary btn-sm" id="playBtn">Play</button>
          <button class="btn btn-outline btn-sm" id="nextBtn">Next</button>
        </span>
        <span class="card-desc">Every frame is a real trajectory step. Nothing is interpolated.</span>
      </div>
      <div class="card-body tight">
        <svg class="viz" id="net" viewBox="0 0 1000 400" role="img"
             aria-label="Contagion network. Assets left, institutional books right."></svg>
      </div>
      <div class="stats" id="stats"></div>
    </div>

    <div class="card">
      <div class="card-header"><span class="card-title">What happened, round by round</span></div>
      <div class="card-body tight">
        <table><tbody id="log"></tbody></table>
      </div>
      <div class="card-footer">
        <a class="btn btn-primary" href="defend.html">Find the cheapest single-position fix</a>
      </div>
    </div>
</main>
<script src="shared.js"></script>
<script src="glow.js"></script>
<script src="shell.js"></script>
<script>
paintShell("cascade");
bindKeys("cascade");
(async () => { if (await seedDemoIfAsked()) location.replace(location.pathname); })();
const r = requireResult("cascade");
/* No trajectory, nothing to step: the status bar was still offering "← →
   step │ space play" over an empty state. */
if (r) (async () => {
  const limitX = (r.params.leverage * r.params.band).toFixed(2);
  document.getElementById("lede").textContent =
    `If ${r.asset} fell ${r.pct.toFixed(2)}%, that alone would cost you ${pct(r.direct_loss)}. ` +
    `Here is what the modelled books do next. Red means a book is over its ` +
    `${limitX}× leverage limit and selling.`;

  const body = await api(`/api/cascade?asset=${encodeURIComponent(r.asset)}` +
    `&magnitude=${Math.abs(r.magnitude)}&leverage=${r.params.leverage}` +
    `&gamma=${r.params.gamma}&band=${r.params.band}`);

  const T = body.tickers, F = body.funds, frames = body.trajectory;
  /* 470 put the round-by-round log below the fold at 1440x900 — and this is
     the one page where the picture and the log have to be read together. 400
     leaves 34px a row, which still clears an 11px label over a 10px figure. */
  const W = 1000, H = 620;
  const svg = document.getElementById("net");
  /* §4 wraps the product's one orchestrated animation in this, and the same
     courtesy applies to anything else that moves. The flow dots are the only
     other motion in the app and they are user-triggered — you pressed Next or
     Play — but somebody who has asked their machine for less movement has
     asked for less of this too. */
  const reduceMotion = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  /* The viewBox was written into the markup and the drawing size lives here,
     so the two drifted the moment the diagram grew: everything below y=400 —
     two assets, a fund's readout and the whole "your book" strip — was being
     drawn and then clipped away by an attribute in a different file. One
     source. */
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const ns = "http://www.w3.org/2000/svg";
  const mk = (t, a) => { const e = document.createElementNS(ns, t);
    for (const k in a) e.setAttribute(k, a[k]); return e; };

  /* Rows were in dataset order, which is arbitrary. Sorting by how much
     institutional money sits in each name puts the crowded ones at the top —
     which is the property the whole diagram is about, and it makes NVDA's
     position on screen an argument rather than a coincidence. */
  const ownership = T.map((_, i) => body.holdings.reduce((a, row) => a + row[i], 0));
  const order = T.map((_, i) => i).sort((a, b) => ownership[b] - ownership[a]);
  const rowOf = [];
  order.forEach((assetIndex, row) => { rowOf[assetIndex] = row; });

  /* The network occupies the top; the strip underneath is the user's own book,
     which the diagram never showed before. That omission mattered: the page
     explains how damage reaches YOU, and the only thing on screen was other
     people's balance sheets. */
  const NET_H = 500;
  const AX = 300, FX = 620;                    // the two node columns
  const BAR_X = 100, BAR_W = 120;              // per-asset cumulative fall
  const GAUGE_X = 644, GAUGE_W = 150;          // per-fund leverage gauge
  const YOU_X = 132, YOU_W = 760, YOU_Y = 556; // the book's loss bar

  const ay = (i) => 44 + rowOf[i] * ((NET_H - 88) / (T.length - 1));
  const fy = (j) => 96 + j * ((NET_H - 200) / (F.length - 1));
  const maxPos = Math.max(...body.holdings.flat());
  /* The busiest round, so flow widths are comparable ACROSS rounds — scaling
     each frame to its own maximum would make the last round's trickle look
     like the first round's flood. */
  const maxSold = Math.max(1, ...frames.map(f =>
    Math.max(0, ...(f.sold || []).flat())));

  let at = 0, timer = null;

  function draw(t) {
    const f = frames[Math.min(t, frames.length - 1)];
    svg.textContent = "";
    /* Two layers, because the picture has two things to say.

       The substrate is who owns what — the crowding itself, static, faint. It
       is the reason a shock to one name reaches a book that never held it.

       The flow is what was SOLD in this round, and it is the thing that was
       missing: the edges used to be drawn from position sizes in a fixed grey,
       so they came out identical on every frame. Fifty lines redrawn each tick
       to look exactly the same, while `sold` sat in the payload carrying
       $8.72B, then $2.49B, then $0.82B. The cascade was in hand and not drawn.

       Now round 1 lights up thick, round 2 thinner, round 3 a trickle, and the
       diagram shows deleveraging chasing itself down to nothing — which is the
       one idea this page exists to land. */
    /* ── the substrate: who owns what ─────────────────────────────────── */
    body.holdings.forEach((row, j) => row.forEach((v, i) => {
      if (v <= 0) return;
      svg.appendChild(mk("line", { class: "cx-hold", x1: AX, y1: ay(i), x2: FX, y2: fy(j),
        "stroke-width": Math.max(.4, (v / maxPos) * 2.6) }));
    }));

    /* ── the flow: what was SOLD this round ───────────────────────────── */
    (f.sold || []).forEach((row, j) => row.forEach((usd, i) => {
      if (usd <= 0) return;
      const share = usd / maxSold;
      /* Forced selling IS a limit being crossed — a book over its leverage
         band, liquidating. That is the one thing §1 lets colour mean, and it
         is the whole subject of this page. */
      svg.appendChild(mk("line", { class: "cx-sell", x1: FX, y1: fy(j), x2: AX, y2: ay(i),
        "stroke-opacity": (0.22 + 0.6 * share).toFixed(3),
        "stroke-width": Math.max(.6, share * 5.2), "stroke-linecap": "round" }));

      /* Dollars actually moving, fund to asset. Width alone said how much was
         sold; it could not say that anything was being sold AT you, which is
         the direction the whole page is about. The count scales with the size
         of the flow, so a heavy edge is visibly busier than a trickle rather
         than just thicker.

         SVG's own <animate> rather than a rAF loop on purpose: draw() runs on
         every step and every play tick, so a JS animation here would need its
         own teardown and would be one more thing able to outlive the frame it
         belongs to. These die with the elements they hang off when the svg is
         cleared. */
      if (!reduceMotion) {
        const dots = 1 + Math.round(share * 2);
        const dur = (1.6 - 0.5 * share).toFixed(2);
        for (let k = 0; k < dots; k++) {
          const dot = mk("circle", { class: "cx-flow", r: (1.6 + share * 1.8).toFixed(2),
                                     cx: FX, cy: fy(j) });
          const phase = (-(k / dots) * dur).toFixed(2);
          dot.appendChild(mk("animate", { attributeName: "cx", values: `${FX};${AX}`,
            dur: `${dur}s`, begin: `${phase}s`, repeatCount: "indefinite" }));
          dot.appendChild(mk("animate", { attributeName: "cy", values: `${fy(j)};${ay(i)}`,
            dur: `${dur}s`, begin: `${phase}s`, repeatCount: "indefinite" }));
          dot.appendChild(mk("animate", { attributeName: "opacity",
            values: "0;0.9;0.9;0", dur: `${dur}s`, begin: `${phase}s`,
            repeatCount: "indefinite" }));
          svg.appendChild(dot);
        }
      }
    }));

    /* ── assets: name, whether you hold it, and how far it has fallen ─── */
    const worstDrop = Math.max(0.0001, ...frames.map(fr =>
      Math.max(...fr.prices.map(pr => 1 - pr))));
    T.forEach((sym, i) => {
      const drop = 1 - f.prices[i];
      /* Half a basis point: the threshold the readout beside it ROUNDS at, not
         an epsilon. Gated at 1e-9 the dot lit up for a move the formatter then
         printed as "−0.00%" — a minus written by hand in front of a rounded
         zero, which is the exact bug the comment below says was fixed. A sweep
         of the 18 names at five magnitudes found 18 frames doing it. */
      const hot = drop * 100 >= 0.005;
      const y = ay(i);

      /* The names YOU hold, marked on the diagram that explains what happens
         to them. Without this the left column is a list of other people's
         positions and the page never says which of them are yours. */
      if (weightOf(sym) > 0) {
        svg.appendChild(mk("rect", { class: "cx-yours", x: 14, y: y - 4, width: 5, height: 8 }));
      }

      const lbl = mk("text", { class: "cx-label num", x: 88, y: y + 4, "text-anchor": "end" });
      lbl.textContent = sym; svg.appendChild(lbl);

      /* Cumulative fall, as a bar. The figure alone made every round after the
         first look the same; a bar that grows is the cascade happening. Scaled
         to the worst fall across ALL rounds so the bars are comparable frame
         to frame rather than rescaling under the cursor. */
      svg.appendChild(mk("rect", { class: "cx-fall-track",
        x: BAR_X, y: y - 4, width: BAR_W, height: 8 }));
      if (hot) {
        svg.appendChild(mk("rect", { class: "cx-fall",
          x: BAR_X, y: y - 4, width: Math.max(1, (drop / worstDrop) * BAR_W), height: 8 }));
      }

      /* An asset that has not moved shows nothing: nine of ten reading 0.00%
         is dead ink, and it made the frame where contagion arrives look
         identical to the one before it. (The original bug was "−0.00%" — a
         minus written by hand in front of a formatter, trusted.) */
      const val = mk("text", { class: `cx-sub${hot ? " hot" : ""}`,
        x: BAR_X + BAR_W + 10, y: y + 4 });
      val.textContent = hot ? `−${(drop * 100).toFixed(2)}%` : "";
      svg.appendChild(val);

      svg.appendChild(mk("circle", { class: `cx-asset${hot ? " hot" : ""}`,
        cx: AX, cy: y, r: 5.5 }));
    });

    /* ── funds: leverage against the band, and what they sold ─────────── */
    const limitLev = r.params.leverage * r.params.band;
    const levMax = Math.max(limitLev * 1.35, ...frames.flatMap(fr =>
      fr.leverage.map(l => (l === null ? limitLev * 1.35 : l))));
    /* Two different moments, and the diagram has to keep them apart.

       A frame's `breached` is who was over the limit at the START of the round
       — the funds that actually sold in it. A frame's `leverage` is where they
       ended up AFTER selling and repricing. So a book can finish a round above
       its band having not sold during it: it crosses now and liquidates next
       round.

       Drawing the gauge from `leverage` and the box from `breached` is right,
       but putting them side by side unlabelled produced "5.38× / 5.25×" next
       to a grey box reading "holding", which looks like the picture
       contradicting itself. Named properly it is the most interesting thing on
       the screen — you can watch a fund cross the line one round before it
       acts. */
    F.forEach((name, j) => {
      const sold = (f.breached || []).includes(j);
      const y = fy(j);
      const lev = f.leverage[j];
      const over = lev === null || lev > limitLev + 1e-9;
      const isLast = t >= frames.length - 1;
      const soldRow = (f.sold || [])[j] || [];
      const soldUsd = soldRow.reduce((a, b) => a + b, 0);

      svg.appendChild(mk("rect", { class: `cx-fund${sold ? " breached" : ""}`,
        x: FX - 7, y: y - 7, width: 14, height: 14 }));

      const lbl = mk("text", { class: "cx-name", x: FX + 24, y: y - 10 });
      lbl.textContent = name; svg.appendChild(lbl);

      /* The gauge is the whole reason a book sells. The number alone ("lev
         6.00x") gave no threshold, so red against grey had no visible rule —
         the limit these boxes are compared against never appeared on screen. */
      svg.appendChild(mk("rect", { class: "cx-gauge-track",
        x: GAUGE_X, y: y - 4, width: GAUGE_W, height: 7 }));
      if (lev !== null && lev > 0) {
        svg.appendChild(mk("rect", { class: `cx-gauge${over ? " breached" : ""}`,
          x: GAUGE_X, y: y - 4,
          width: Math.max(1, Math.min(1, lev / levMax) * GAUGE_W), height: 7 }));
      }
      const tick = GAUGE_X + (limitLev / levMax) * GAUGE_W;
      svg.appendChild(mk("line", { class: "cx-gauge-limit",
        x1: tick, y1: y - 8, x2: tick, y2: y + 7 }));

      const sub = mk("text", { class: `cx-sub${(sold || over) ? " breached" : ""}`,
        x: GAUGE_X, y: y + 20 });
      /* Kept short on purpose: at the previous width this line ran off the
         right edge of the viewBox, taking the gauge track with it. */
      const state = soldUsd > 0 ? `${usd(soldUsd)} sold`
                  : over ? (isLast ? "over its limit" : "over — sells next round")
                  : "within";
      sub.textContent = lev === null
        ? `insolvent · ${usd(soldUsd)} sold`
        : `${lev.toFixed(2)}× / ${limitLev.toFixed(2)}× · ${state}`;
      svg.appendChild(sub);
    });

    /* ── your book, which is what all of this is doing to you ─────────── */
    {
      const cumNow = 1 - f.prices.reduce((acc, pr, i) => acc + pr * weightOf(T[i]), 0) - cashW;
      const scale = Math.max(r.params.limit, cumNow) * 1.25 || 1;
      const lim = YOU_X + (r.params.limit / scale) * YOU_W;
      const over = cumNow >= r.params.limit;

      const cap = mk("text", { class: "cx-name", x: 14, y: YOU_Y + 4 });
      cap.textContent = "your book"; svg.appendChild(cap);

      svg.appendChild(mk("rect", { class: "cx-you-track",
        x: YOU_X, y: YOU_Y - 7, width: YOU_W, height: 14 }));
      svg.appendChild(mk("rect", { class: `cx-you${over ? " breached" : ""}`,
        x: YOU_X, y: YOU_Y - 7,
        width: Math.max(1, (cumNow / scale) * YOU_W), height: 14 }));
      svg.appendChild(mk("line", { class: "cx-you-limit",
        x1: lim, y1: YOU_Y - 13, x2: lim, y2: YOU_Y + 13 }));

      const lt = mk("text", { class: "cx-sub", x: lim + 6, y: YOU_Y + 26 });
      lt.textContent = `your limit ${limitPct(r.params.limit)}`;
      svg.appendChild(lt);

      const amt = mk("text", { class: `cx-you-val${over ? " breached" : ""}`,
        x: YOU_X, y: YOU_Y + 26 });
      amt.textContent = `${pct(cumNow)} lost so far`;
      svg.appendChild(amt);
    }

    document.getElementById("roundTitle").textContent =
      t === 0 ? "Round 0 — shock applied" : `Round ${t} of ${frames.length - 1}`;
    const cum = 1 - f.prices.reduce((acc, p, i) => acc + p * weightOf(T[i]), 0) - cashW;
    document.getElementById("stats").innerHTML = [
      ["Round", `${t} / ${frames.length - 1}`, ""],
      /* this round's set, not the cascade's running total — the analysis page
         shows the total, and identical labels for two different counts read
         as a contradiction one click apart. */
      ["Over limit this round", String((f.breached || []).length), (f.breached || []).length ? "bad" : ""],
      ["Your loss so far", pct(cum), cum >= (r.params.limit) ? "bad" : ""],
      /* the size of the fire in this round, which is what the red edges are
         drawing. Without the number beside them the picture is impressionistic. */
      ["Forced selling this round", usd((f.sold || []).flat().reduce((a, b) => a + b, 0)), ""],
      ["Your limit", limitPct(r.params.limit), ""],
    ].map(([k, v, c]) => `<div class="stat"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`).join("");
  }

  const wmap = {};
  r.portfolio.holdings.forEach(h => { wmap[h.symbol] = h.weight; });
  const cashW = wmap.CASH || 0;
  function weightOf(sym) { return wmap[sym] || 0; }

  document.getElementById("log").innerHTML = frames.map((f, t) => {
    if (t === 0) return `<tr><td class="num muted" style="width:70px">R00</td>
      <td class="t">${r.asset} marked down ${r.pct.toFixed(2)}%</td></tr>`;
    /* A frame's `breached` is who was OVER THE LIMIT AT THE START of that
       round — a state, not a transition. Reading it as "crossed" narrates
       R02 as four books newly breaking when three of them had been over
       since the shock, which is a considerably more alarming sentence than
       the truth. Split the set: who is new here, and who is still over. */
    /* Frame 0 is the post-shock state, not a round of selling — it carries the
       same breach set as frame 1 by construction. Diffing round 1 against it
       makes every book that broke on the shock read as "still over, selling
       again" when round 1 is the first time any of them sells. Round 1 is
       measured against nothing; rounds 2+ against the round before. */
    const prev = new Set(t > 1 ? (frames[t - 1].breached || []) : []);
    const now = f.breached || [];
    const fresh = now.filter(j => !prev.has(j)).map(j => F[j]);
    const still = now.filter(j => prev.has(j)).map(j => F[j]);
    const verb = (n) => n > 1 ? "their limits" : "its limit";
    let msg;
    if (!now.length) msg = "no book is over its limit — the cascade settles";
    else if (!fresh.length)
      msg = `<b>${still.join(", ")}</b> still over ${verb(still.length)}, selling again`;
    else if (!still.length)
      msg = `<b>${fresh.join(", ")}</b> crossed ${verb(fresh.length)} and ${fresh.length > 1 ? "are" : "is"} forced to sell`;
    else
      msg = `<b>${fresh.join(", ")}</b> crossed ${verb(fresh.length)}; <b>${still.join(", ")}</b> still over — all forced to sell`;
    return `<tr><td class="num muted" style="width:70px">R${String(t).padStart(2, "0")}</td><td class="t">${msg}</td></tr>`;
  }).join("");

  const playBtn = document.getElementById("playBtn");
  /* One place that owns the timer and the label, because they were drifting
     apart. Prev and Next did not touch the timer, so stepping during playback
     raced it: three Nexts inside the first 900ms tick jumped to the last frame
     and the button then read "Replay", reporting a playthrough in which rounds
     1 and 2 were never drawn. Stepping is a deliberate act — it takes over. */
  function stop(label) {
    if (timer) { clearInterval(timer); timer = null; }
    playBtn.textContent = label;
  }
  function step(to) {
    stop(at >= frames.length - 1 && to >= frames.length - 1 ? "Replay" : "Play");
    at = Math.max(0, Math.min(frames.length - 1, to));
    /* and the label has to describe where we ARE: stepping back off the end
       used to leave "Replay" sitting over round 2. */
    playBtn.textContent = at >= frames.length - 1 ? "Replay" : "Play";
    draw(at);
  }
  document.getElementById("prevBtn").onclick = () => step(at - 1);
  document.getElementById("nextBtn").onclick = () => step(at + 1);
  playBtn.onclick = () => {
    if (timer) { stop("Play"); return; }
    playBtn.textContent = "Pause";
    at = 0; draw(at);
    /* Someone who has asked the operating system for less motion should not
       get a three-second animation because we only zeroed the CSS durations —
       the movement here is a 900ms setInterval, which no media query touches.
       They get the end state, which is the information; the animation is the
       decoration. */
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      at = frames.length - 1; draw(at); playBtn.textContent = "Replay"; return;
    }
    /* A single-frame cascade has nothing to play through. Without this the
       interval fires once, clamps, and relabels — a 900ms pause pretending to
       be an animation. */
    if (frames.length <= 1) { playBtn.textContent = "Replay"; return; }
    timer = setInterval(() => {
      at += 1;
      if (at >= frames.length - 1) { at = frames.length - 1; stop("Replay"); }
      draw(at);
    }, 900);
  };
  draw(0);
  if (frames.length <= 1) playBtn.textContent = "Replay";

  /* The transport, on the keys a terminal puts it on. bindKeys already ran
     for the page shortcuts; this adds the ones that only mean something here,
     and the status bar advertises them so nobody has to guess. */
  bindKeys("cascade", {
    ArrowLeft: () => step(at - 1),
    ArrowRight: () => step(at + 1),
    " ": () => playBtn.click(),
  });
})();
</script>
</body>
</html>
