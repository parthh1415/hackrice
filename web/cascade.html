<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cascade · Firebreak</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a class="logo" href="index.html" style="color:inherit;text-decoration:none"><i></i>Firebreak</a>
    <div class="nav-links">
      <a href="index.html"    data-page="portfolio">Portfolio</a>
      <a href="analysis.html" data-page="analysis">Analysis</a>
      <a href="cascade.html"  data-page="cascade">Cascade</a>
      <a href="defend.html"   data-page="defend">Defend</a>
      <a href="verify.html"   data-page="verify">Verify</a>
    </div>
    <div class="nav-right">
      <span class="badge" id="navBadge">No portfolio</span>
      <a class="btn btn-ghost btn-sm" href="assumptions.html">Assumptions</a>
    </div>
  </div>
</nav>
<main>
  <div class="wrap page stack gap-8">
    <div class="stack gap-3">
      <span class="eyebrow">Step 3 — Cascade</span>
      <h1>Why the loss grows</h1>
      <p class="lede" id="lede">—</p>
    </div>

    <div class="card">
      <div class="card-header bordered row between">
        <div class="stack gap-2">
          <span class="card-title" id="roundTitle">Round 0</span>
          <span class="card-desc">Every frame is a real trajectory step. Nothing is interpolated.</span>
        </div>
        <div class="row gap-2">
          <button class="btn btn-outline btn-sm" id="prevBtn">Prev</button>
          <button class="btn btn-primary btn-sm" id="playBtn">Play</button>
          <button class="btn btn-outline btn-sm" id="nextBtn">Next</button>
        </div>
      </div>
      <div class="card-body tight">
        <svg class="viz" id="net" viewBox="0 0 1000 470" role="img"
             aria-label="Contagion network. Assets left, institutional books right."></svg>
      </div>
      <div class="stats" id="stats"></div>
    </div>

    <div class="card">
      <div class="card-header bordered"><span class="card-title">What happened, round by round</span></div>
      <div class="card-body tight">
        <table><tbody id="log"></tbody></table>
      </div>
      <div class="card-footer">
        <a class="btn btn-primary" href="defend.html">Find the smallest fix</a>
      </div>
    </div>
  </div>
</main>
<script src="shared.js"></script>
<script>
paintNav("cascade");
const r = requireResult("cascade");
if (r) (async () => {
  document.getElementById("lede").textContent =
    `${r.asset} falls ${r.pct.toFixed(2)}%. That alone costs you ${pct(r.direct_loss)}. ` +
    `Watch what the institutional books do next.`;

  const body = await api(`/api/cascade?asset=${encodeURIComponent(r.asset)}` +
    `&magnitude=${Math.abs(r.magnitude)}&leverage=${r.params.leverage}` +
    `&gamma=${r.params.gamma}&band=${r.params.band}`);

  const T = body.tickers, F = body.funds, frames = body.trajectory;
  const W = 1000, H = 470, LX = 250, RX = 750;
  const svg = document.getElementById("net");
  const ns = "http://www.w3.org/2000/svg";
  const mk = (t, a) => { const e = document.createElementNS(ns, t);
    for (const k in a) e.setAttribute(k, a[k]); return e; };

  const ay = (i) => 46 + i * ((H - 92) / (T.length - 1));
  const fy = (j) => 80 + j * ((H - 160) / (F.length - 1));
  const maxPos = Math.max(...body.holdings.flat());

  let at = 0, timer = null;

  function draw(t) {
    const f = frames[Math.min(t, frames.length - 1)];
    svg.textContent = "";
    body.holdings.forEach((row, j) => row.forEach((v, i) => {
      if (v <= 0) return;
      svg.appendChild(mk("line", { x1: LX, y1: ay(i), x2: RX, y2: fy(j),
        stroke: "hsl(0 0% 22%)", "stroke-width": Math.max(.4, (v / maxPos) * 3.4) }));
    }));
    T.forEach((sym, i) => {
      const drop = 1 - f.prices[i];
      const hot = drop > 1e-9;
      svg.appendChild(mk("circle", { cx: LX, cy: ay(i), r: 6,
        fill: hot ? "hsl(359 100% 61%)" : "hsl(0 0% 30%)" }));
      const lbl = mk("text", { x: LX - 16, y: ay(i) + 4, "text-anchor": "end",
        "font-family": "var(--mono)", "font-size": 12, fill: "hsl(0 0% 75%)" });
      lbl.textContent = sym; svg.appendChild(lbl);
      const val = mk("text", { x: LX - 16, y: ay(i) + 18, "text-anchor": "end",
        "font-family": "var(--mono)", "font-size": 10,
        fill: hot ? "hsl(359 100% 61%)" : "hsl(0 0% 38%)" });
      val.textContent = `−${(drop * 100).toFixed(2)}%`; svg.appendChild(val);
    });
    F.forEach((name, j) => {
      const breached = (f.breached || []).includes(j);
      svg.appendChild(mk("rect", { x: RX - 7, y: fy(j) - 7, width: 14, height: 14, rx: 2,
        fill: breached ? "hsl(359 100% 61%)" : "hsl(0 0% 30%)" }));
      const lbl = mk("text", { x: RX + 20, y: fy(j) + 1,
        "font-family": "var(--sans)", "font-size": 13, fill: "hsl(0 0% 88%)" });
      lbl.textContent = name; svg.appendChild(lbl);
      const lev = mk("text", { x: RX + 20, y: fy(j) + 17,
        "font-family": "var(--mono)", "font-size": 10,
        fill: breached ? "hsl(359 100% 61%)" : "hsl(0 0% 38%)" });
      lev.textContent = f.leverage[j] === null ? "INSOLVENT" : `L ${f.leverage[j].toFixed(2)}`;
      svg.appendChild(lev);
    });
    document.getElementById("roundTitle").textContent =
      t === 0 ? "Round 0 — shock applied" : `Round ${t} of ${frames.length - 1}`;
    const cum = 1 - f.prices.reduce((acc, p, i) => acc + p * weightOf(T[i]), 0) - cashW;
    document.getElementById("stats").innerHTML = [
      ["Round", `${t} / ${frames.length - 1}`, ""],
      ["Books breached", String((f.breached || []).length), (f.breached || []).length ? "bad" : ""],
      ["Your loss so far", pct(cum), cum >= (r.params.limit) ? "bad" : ""],
      ["Your limit", pct(r.params.limit, 0), ""],
    ].map(([k, v, c]) => `<div class="stat"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`).join("");
  }

  const wmap = {};
  r.portfolio.holdings.forEach(h => { wmap[h.symbol] = h.weight; });
  const cashW = wmap.CASH || 0;
  function weightOf(sym) { return wmap[sym] || 0; }

  document.getElementById("log").innerHTML = frames.map((f, t) => {
    if (t === 0) return `<tr><td class="num muted" style="width:90px">R00</td>
      <td>${r.asset} marked down ${r.pct.toFixed(2)}%</td></tr>`;
    const who = (f.breached || []).map(j => F[j]);
    const msg = who.length
      ? `<b>${who.join(", ")}</b> crossed ${who.length > 1 ? "their limits" : "its limit"} and ${who.length > 1 ? "are" : "is"} forced to sell`
      : "no new breaches — the cascade settles";
    return `<tr><td class="num muted" style="width:90px">R${String(t).padStart(2, "0")}</td><td>${msg}</td></tr>`;
  }).join("");

  document.getElementById("prevBtn").onclick = () => { at = Math.max(0, at - 1); draw(at); };
  document.getElementById("nextBtn").onclick = () => { at = Math.min(frames.length - 1, at + 1); draw(at); };
  document.getElementById("playBtn").onclick = () => {
    if (timer) { clearInterval(timer); timer = null; document.getElementById("playBtn").textContent = "Play"; return; }
    document.getElementById("playBtn").textContent = "Pause";
    at = 0; draw(at);
    timer = setInterval(() => {
      at += 1;
      if (at >= frames.length) { clearInterval(timer); timer = null;
        document.getElementById("playBtn").textContent = "Replay"; at = frames.length - 1; }
      draw(at);
    }, 900);
  };
  draw(0);
})();
</script>
</body>
</html>
