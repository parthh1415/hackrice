<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Validate · Firebreak</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shell.css">
</head>
<body class="shell">
<main class="col">
    <header>
      <h1>Did it actually help?</h1>
      <p class="lede">A recommendation is not evidence. Here is the same shock replayed, the
        break point recomputed, and both portfolios scored across 400 simulated stresses.</p>
    </header>
    <div id="root"></div>
</main>
<script src="shared.js"></script>
<script src="shell.js"></script>
<script>
paintShell("verify");
bindKeys("verify");
(async () => { if (await seedDemoIfAsked()) location.replace(location.pathname); })();
const r = requireResult("verify");
if (r && r.validation) {
  const v = r.validation, s = v.identical_shock, n = v.new_breaking_point, syn = v.synthetic;
  const sv = (x) => (x === null || x === undefined ? "—" : pct(x, 0));

  /* When the defended book has no break point in the tested range, the engine
     sends after_pct: null and omits moved_pp and moved_ratio entirely. Four
     .toFixed() calls on those used to throw INSIDE the template literal, so
     root.innerHTML never got assigned and the page rendered a heading, a
     promise of three sections, and nothing else — blank exactly when the fix
     worked best. Say what happened instead.

     "No break point in the tested range" is not "unbreakable", and the copy
     below keeps that distinction: we searched a range and found nothing in
     it. */
  /* §1: there is deliberately no green. A pass is set in ink like every other
     figure on the page, and only the breach carries the one colour — which is
     the whole point of having exactly one. */
  const verdict = (breaks) => breaks
    ? `<span class="badge badge-bad"><i></i>Breach</span>`
    : `<span class="badge">Within limit</span>`;
  const safe = !!n.after_unbreakable || n.after_pct === null || n.after_pct === undefined;
  const afterBreak = safe ? "none in range" : `−${n.after_pct.toFixed(2)}%`;
  const movedBy = safe
    ? "no shock in the tested range breaks the defended book"
    /* "points" here and "pp" on the Model page for the same unit. And the
       break point moved from −24.69% to −27.76%, which is more negative, while
       the delta is shown positive — both are true (the SHOCK is bigger, the
       price is lower) and printing a bare "+3.07" beside two negatives invites
       the reader to do the wrong subtraction. Say which direction it moved. */
    : `${n.moved_pp.toFixed(2)} pp further from breaking`;
  const movedPoints = safe ? "—" : `${n.moved_pp.toFixed(2)} pp`;
  /* moved_ratio is a ratio, and "12%" at 0dp in a table where everything else
     carries two decimals reads as a measured percentage rather than a
     rounding of 1.1242. */
  const extraShock = safe || n.moved_ratio == null
    ? "—" : `×${n.moved_ratio.toFixed(2)}`;
  document.getElementById("root").innerHTML = `
  <div class="stack">
    <div class="card">
      <!-- These read "before → after" with the after in green. Two problems:
           there is no green in this product, and → is in no subset of any font
           it ships, so the arrow itself fell through to the system face. The
           defended figure is what the page is for, so it is the figure; the
           undefended one is what it is measured against, so it is the caption
           underneath. Same two numbers, no arrow, no second colour. -->
      <div class="stats" id="verdictTiles">
        <div class="stat"><div class="k">Break point, defended</div>
          <div class="v">${afterBreak}</div>
          <div class="s">was −${n.before_pct.toFixed(2)}% — ${movedBy}</div></div>
        <div class="stat"><div class="k">Loss at the same shock</div>
          <div class="v">${pct(s.after_loss)}</div>
          <div class="s">was ${pct(s.before_loss)}, which ${s.before_breaks ? "breached" : "was within"} the limit</div></div>
        <div class="stat"><div class="k">Worst of ${syn.scenarios}</div>
          <div class="v">${pct(syn.after.worst_loss)}</div>
          <div class="s">was ${pct(syn.before.worst_loss)} across the same draws</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">1 — The same shock, replayed</span><span class="sub">${s.note}</span>
      </div>
      <div class="card-body tight"><table>
        <thead><tr><th></th><th class="r">Current book</th><th class="r">Defended book</th></tr></thead>
        <tbody>
          <tr><td>Shock</td><td class="r num">${r.asset} −${s.shock_pct.toFixed(2)}%</td><td class="r num">${r.asset} −${s.shock_pct.toFixed(2)}%</td></tr>
          <tr><td>Portfolio loss</td><td class="r num">${pct(s.before_loss)}</td><td class="r num">${pct(s.after_loss)}</td></tr>
          <tr><td>Outcome</td>
            <!-- these were captions, not readings: "Breach" in red and "Within
                 limit" in green were written into the markup, so the page whose
                 entire job is proving the fix worked asserted that it had
                 regardless of what the replay returned. The row above them has
                 always derived from before_breaks/after_breaks. -->
            <td class="r">${verdict(s.before_breaks)}</td>
            <td class="r">${verdict(s.after_breaks)}</td></tr>
        </tbody></table></div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">2 — The new break point</span><span class="sub">Recomputed by re-running the same search against the defended
          book — not derived from the size of the cut.</span>
      </div>
      <div class="card-body tight"><table class="pairs"><tbody>
        <tr><td>Break point, current book</td><td class="r num">−${n.before_pct.toFixed(2)}%</td></tr>
        <tr><td>Break point, defended book</td><td class="r num">${afterBreak}</td></tr>
        <tr><td>Moved outward by</td><td class="r num">${movedPoints}</td></tr>
        <tr><td>Shock needed, relative to before</td><td class="r num">${extraShock}</td></tr>
      </tbody></table></div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">3 — ${syn.scenarios} simulated stresses</span><span class="sub">${syn.shock_range_pct ? syn.shock_range_pct[0] + "–" + syn.shock_range_pct[1] + "% single-name shocks, " : ""}identical draws for both books. Seed ${syn.seed}, so this
          reproduces exactly.</span>
      </div>
      <div class="card-body tight"><table>
        <thead><tr><th></th><th class="r">Current</th><th class="r">Defended</th></tr></thead>
        <tbody>
          <!-- 98% and 99% are 392/400 and 396/400. At a 5% limit they round
               to 80% and 81% and hide 80.25 against 80.75 — a difference of
               two scenarios, invisible. The denominator is already in the
               card title, so print the count. -->
          <tr><td>Stayed under your limit</td>
            <td class="r num">${Math.round(syn.before.survival * syn.scenarios)} / ${syn.scenarios}</td>
            <td class="r num">${Math.round(syn.after.survival * syn.scenarios)} / ${syn.scenarios}</td></tr>
          <tr><td>Median loss</td><td class="r num">${pct(syn.before.median_loss)}</td><td class="r num">${pct(syn.after.median_loss)}</td></tr>
          <tr><td>95th percentile</td><td class="r num">${pct(syn.before.p95_loss)}</td><td class="r num">${pct(syn.after.p95_loss)}</td></tr>
          <tr><td>Worst modelled</td><td class="r num">${pct(syn.before.worst_loss)}</td><td class="r num">${pct(syn.after.worst_loss)}</td></tr>
        </tbody></table></div>
      <div class="card-footer"><span class="small muted">These are our scenarios, not a
        probability about the world.</span>
        <!-- the chain continues: your book is defended and checked, so the
             question widens to the system it sits in. -->
        <a class="btn btn-primary push" href="boundary.html">Map the whole system</a></div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">4 — Historical replay</span><span class="sub">Not available in this build.</span>
      </div>
      <div class="card-body">
        <p class="lede">${v.historical.reason}</p>
        <p class="lede" style="margin-top:12px">It would answer: ${v.historical.what_it_would_answer}
          We would rather show you nothing than a number computed from returns we invented.</p>
      </div>
    </div>
  </div>`;
}
</script>
</body>
</html>
