<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firebreak</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230D0D0D'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%23FF383B'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="mast">
    <div class="wordmark">Firebreak<small>Reverse stress testing</small></div>

    <div class="badge" id="badge" data-mode="cached">
      <span class="dot"></span><span id="badgeText">connecting</span>
    </div>
    <button class="ghost" id="assumeBtn" aria-haspopup="dialog">Assumptions</button>

    <div class="hero">
      <span class="hero-val num" id="heroVal" data-idle>—</span>
      <span class="hero-meta">
        <span class="hero-label">Critical shock distance</span>
        <span class="hero-sub" id="heroSub">smallest single-name drop that breaks the system</span>
        <span class="hero-note" id="heroNote"></span>
      </span>
    </div>
  </header>

  <aside class="rail">
    <div class="knob">
      <label for="leverage">Gross leverage <b class="num" id="leverageVal">5.0</b></label>
      <input type="range" id="leverage" min="1.5" max="8" step="0.1" value="5">
    </div>
    <div class="knob">
      <label for="gamma">Price impact γ <b class="num" id="gammaVal">0.20</b></label>
      <input type="range" id="gamma" min="0" max="1" step="0.05" value="0.2">
    </div>
    <div class="knob">
      <label for="breachBand">Breach band <b class="num" id="breachBandVal">1.05</b></label>
      <input type="range" id="breachBand" min="1.0" max="1.5" step="0.01" value="1.05">
    </div>
    <div class="knob">
      <label for="breaches">Failure condition</label>
      <select id="breaches">
        <option value="2">≥ 2 funds breach</option>
        <option value="3" selected>≥ 3 funds breach</option>
        <option value="4">≥ 4 funds breach</option>
        <option value="5">≥ 5 funds breach</option>
      </select>
    </div>

    <div class="actions">
      <button class="primary" id="attackBtn">Find weakest shock</button>
      <button id="replayBtn">Replay cascade</button>
      <button id="boundaryBtn">Map the boundary</button>
      <button id="defendBtn" disabled>Stabilise</button>
    </div>

    <div class="solver" id="solver">
      <span class="k">Numerical engine</span>
      <span class="v" id="solverName">—</span>
      <span class="v" id="solverStats"><span>awaiting solve</span></span>
    </div>
  </aside>

  <main class="stage" id="stage">
    <div class="scene" id="sceneNetwork">
      <svg id="network" role="img"
           aria-label="Contagion network. Assets on the left, portfolios on the right, edge thickness proportional to position value, nodes coloured by state."></svg>
    </div>

    <div class="scene" id="sceneBoundary" hidden>
      <svg id="boundary" role="img"
           aria-label="Phase diagram. Portfolio overlap on the horizontal axis, gross leverage on the vertical, shaded by amplification, with the real system marked."></svg>
    </div>

    <div class="scene split-scene" id="sceneSplit" hidden>
      <div class="fix-line" id="fixLine" hidden></div>
      <div class="bought" id="boughtLine" hidden></div>
      <div class="split">
        <div class="split-half">
          <div class="split-cap">Before</div>
          <svg id="netBefore" role="img" aria-label="Cascade outcome before intervention."></svg>
          <div class="split-foot num" id="footBefore">—</div>
        </div>
        <div class="divider"></div>
        <div class="split-half">
          <div class="split-cap"><b>After firebreak</b></div>
          <svg id="netAfter" role="img" aria-label="Cascade outcome after the intervention, under the identical shock."></svg>
          <div class="split-foot num" id="footAfter">—</div>
        </div>
      </div>
      <div class="split-stamp"><span id="splitRound">—</span><span class="num" id="shockStamp">—</span></div>
    </div>
  </main>

  <div class="timeline">
    <span class="tl-label" id="roundLabel">no run</span>
    <div class="tl-track" id="track"></div>
  </div>

  <div class="band" id="band">
    <div class="cell"><span class="v num">—</span><span class="l">Shock loss</span></div>
    <div class="cell"><span class="v num">—</span><span class="l">After cascade</span></div>
    <div class="cell"><span class="v num">—</span><span class="l">Amplification</span></div>
    <div class="cell"><span class="v num">—</span><span class="l">Breaches</span></div>
    <div class="cell"><span class="v num">—</span><span class="l">Rounds</span></div>
  </div>

  <div class="overlay" id="assumePanel" hidden role="dialog" aria-label="Assumptions and what this does not claim">
    <div class="sheet">
      <div class="sheet-head">
        <h2>What is measured, and what is declared</h2>
        <button class="ghost" id="assumeClose">Close</button>
      </div>
      <dl class="assume" id="assumeBody"></dl>
    </div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
